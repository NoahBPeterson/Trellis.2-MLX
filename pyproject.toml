[project]
name = "trellis2-mlx"
version = "0.1.0.dev0"
description = "MLX port of Microsoft TRELLIS.2-4B image-to-3D model for Apple Silicon"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx>=0.18.0",
    "numpy>=1.26",
    "safetensors>=0.4",
    "huggingface-hub>=0.35",
    "torch>=2.8",
    "easydict>=1.13",
    "tqdm>=4.66",
    "pillow>=10.0",
    "opencv-python>=4.13.0.92",
]

[project.optional-dependencies]
postprocess = [
    "trimesh>=4.0",
    "xatlas>=0.0.9",
    "scipy>=1.11",
    "fast-simplification>=0.1",   # backend for trimesh.simplify_quadric_decimation
    "numba>=0.65.1",
]
image-cond = [
    "transformers>=4.50",
]
rembg = [
    "transformers>=4.50",
    # BiRefNet's remote modeling code imports these at load time; they have to be
    # installed before `AutoModelForImageSegmentation.from_pretrained("briaai/RMBG-2.0")` works.
    "kornia>=0.7",
    "timm>=0.9",
    "torchvision>=0.15",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trellis2_mlx"]
